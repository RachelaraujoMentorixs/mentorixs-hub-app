<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-mentorixs.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#17243B" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mentorixs Hub" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      #mx-splash{position:fixed;inset:0;display:grid;place-items:center;background:#341E6E;color:#fff;font-family:Inter,system-ui,sans-serif;text-align:center}
      #mx-splash img{width:88px;height:88px;border-radius:22px}
      #mx-splash b{display:block;margin-top:14px;font-size:20px}#mx-splash small{opacity:.6}
      @media (display-mode: standalone){#root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);box-sizing:border-box;height:100dvh}}
      #mx-upd{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:99999;display:none;align-items:center;gap:12px;justify-content:space-between;background:#17243B;color:#fff;border-radius:14px;padding:12px 14px;font:600 14px Inter,system-ui,sans-serif;box-shadow:0 8px 30px #0006;max-width:460px;margin:auto}
      #mx-upd button{background:#6d4fc2;color:#fff;border:0;border-radius:9px;padding:9px 14px;font:600 14px Inter,system-ui,sans-serif}
    </style>
    <title>Mentorixs Hub</title>
    <script src="/config.js"></script>
    <script type="module" crossorigin src="/index-Mx251127g.js"></script>
    <link rel="stylesheet" crossorigin href="/index-D21vzWeD.css">
  </head>
  <body>
    <div id="root"><div id="mx-splash"><div><img src="/pwa/icon-192.png" alt="" /><b>Mentorixs Hub</b><small>Carregando…</small></div></div></div>
    <div id="mx-upd" role="status"><span>Nova versão do Hub disponível.</span><button id="mx-upd-btn">Atualizar</button></div>
    <script>
      /* Captura o convite de instalação (Android/desktop) antes do app carregar. */
      window.__mxPrompt = null;
      addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__mxPrompt = e; dispatchEvent(new Event('mx-install-change')); });
      addEventListener('appinstalled', function () { window.__mxPrompt = null; dispatchEvent(new Event('mx-install-change')); });
      if ('serviceWorker' in navigator) {
        addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').then(function (reg) {
            function aviso(w) { var b = document.getElementById('mx-upd'); b.style.display = 'flex'; document.getElementById('mx-upd-btn').onclick = function () { w.postMessage('ATUALIZAR'); }; }
            if (reg.waiting && navigator.serviceWorker.controller) aviso(reg.waiting);
            reg.addEventListener('updatefound', function () {
              var w = reg.installing; if (!w) return;
              w.addEventListener('statechange', function () { if (w.state === 'installed' && navigator.serviceWorker.controller) aviso(w); });
            });
            setInterval(function () { reg.update().catch(function () {}); }, 30 * 60 * 1000);
          }).catch(function () {});
          var recarregou = false, tinha = !!navigator.serviceWorker.controller;
          navigator.serviceWorker.addEventListener('controllerchange', function () { if (recarregou || !tinha) return; recarregou = true; location.reload(); });
        });
      }
    </script>
  </body>
</html>
